name: Release

# Push a tag like v0.1.0 to publish to PyPI and create a GitHub Release.
# A release candidate (v0.1.0-rc1) goes to TestPyPI and is marked as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in "$version"|"$version"-rc*) ;; *) echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1 ;; esac
      - name: Test
        run: |
          uv sync --locked
          uv run pytest -q
      - name: Build the web UI into the package
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build the wheel and sdist
        run: uv build
      - name: Check the wheel ships the UI and the licence
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for want in ("slm/web_dist/index.html",):
              assert want in names, f"{want} missing from the wheel"
          assert any(n.endswith("licenses/LICENSE") for n in names), "LICENSE missing from the wheel"
          print("wheel ok:", len(names), "files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (release candidates)
        if: contains(github.ref_name, '-rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, '-rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-rc*}"
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$base" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "SLM Forge $version" --notes-file notes.md $flags
