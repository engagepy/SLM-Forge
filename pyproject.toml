[project]
name = "slm-forge"
version = "0.1.0"
description = "Build your own small language model on a Mac by talking to an agent: data, MLX fine-tuning, evaluation and export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Zorawar Purohit", email = "42845567+engagepy@users.noreply.github.com" }]
requires-python = ">=3.13"
keywords = ["llm", "small-language-model", "fine-tuning", "lora", "mlx", "apple-silicon", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.8.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "mlx-lm-lora>=3.1.3",
    "openai>=3.19.2",
    "openai-agents>=0.22.3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.urls]
Homepage = "https://github.com/engagepy/SLM-Forge"
Issues = "https://github.com/engagepy/SLM-Forge/issues"
Changelog = "https://github.com/engagepy/SLM-Forge/blob/main/CHANGELOG.md"

[project.scripts]
slm = "slm.cli:main"
slm-forge = "slm.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "slm"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `Column == True` / `== None` build SQL expressions; the Pythonic rewrite breaks queries.
ignore = ["E711", "E712"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with calls in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Inline fixture literals read better unwrapped.
"tests/*" = ["E501"]
