[project]
name = "slm-intro"
version = "0.1.0"
description = "Local platform for fine-tuning small language models on Apple Silicon with MLX"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "mlx-lm-lora>=3.1.3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
slm = "slm.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "slm"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `Column == True` / `== None` build SQL expressions; the Pythonic rewrite breaks queries.
ignore = ["E711", "E712"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with calls in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Inline fixture literals read better unwrapped.
"tests/*" = ["E501"]
